<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
    <script>
        try {
        vkBridge.send('VKWebAppInit')
            .then(() => console.log("VK Bridge успешно запущен!"))
            .catch(e => console.error("Ошибка при старте VK Bridge:", e));
    } catch (err) {
        console.error("vkBridge не доступен:", err);
    }

        const urlParams = new URLSearchParams(window.location.search);
        const isVK = urlParams.has('vk_user_id');
        const isTG = !!(window.Telegram?.WebApp?.initData || urlParams.has('tgWebAppStartParam'));

        // if (isVK) {
        //     vkBridge.send('VKWebAppInit')
        //         .then(() => console.log("VK Bridge инициализирован"))
        //         .catch(e => console.error("Ошибка инициализации ВК:", e));
        // } else if (isTG) {
        //     window.Telegram.WebApp.ready();
        // }
        if (isTG) {
        window.Telegram.WebApp.ready();
    }

        async function registration() {
            const results = {};
            const field_1 = document.getElementById("main_field_1");
            const field_2 = document.getElementById("main_field_2");
            const field_3 = document.getElementById("main_field_3");
            const data_1 = field_1.value;
            const data_2 = field_2.value;
            const data_3 = field_3.value;
            results['Фамилия'] = data_1;
            results['Имя'] = data_2;
            results['Отчество'] = data_3;
            const dataString = JSON.stringify(results);
            if (isTG) {
                try{window.Telegram.WebApp.sendData(dataString);}
                catch (e) {
                alert("Ошибка: " + e.message);
            }
                finally {
                window.Telegram.WebApp.close();
            }
                    }
            else if (isVK) {
                    try {
                        let groupId = urlParams.get('vk_group_id');
                
                    if (!groupId) groupId = "239290737"; 

                    await vkBridge.send('VKWebAppShare', {
                        link: `https://vk.com/write-${groupId}`, 
                        text: `Мои данные регистрации: ${dataString}`
                    });
                
                    vkBridge.send('VKWebAppClose', { status: 'success' });
            }
                    catch (vkErr) {
                        console.log("Пользователь отменил отправку или открыл не из группы");
                    }
                    finally {
                        vkBridge.send('VKWebAppClose', { status: 'success' });
                    }
                }}
    

    </script>
</head>
<div>
    <h2>Регистрация</h2>
     <div style="font-family: Verdana, sans-serif; color: #333;">
        <form>
            <input type="text" class="field" style="width: 100%; height: 40px; font-weight: bold; border-radius: 10px; font-size: 16px;" id="main_field_1" placeholder="Фамилия"></input>
        </form>
        <form>
            <input type="text" class="field" style="width: 100%; height: 40px; font-weight: bold; border-radius: 10px; font-size: 16px;" id="main_field_2" placeholder="Имя"></input>
        </form>
        <form>
            <input type="text" class="field" style="width: 100%; height: 40px; font-weight: bold; border-radius: 10px; font-size: 16px;" id="main_field_3" placeholder="Отчество"></input>
        </form>
    </div>
     <button style="
    background-color: #4b3697;
    color: white; 
    padding: 15px 30px; 
    font-size: 18px; 
    border: none;
    border-radius: 10px;    
    cursor: pointer;
     width: 100%;
    text-align: center;"
    id="main-btn" onclick="registration()">Зарегистрироваться</button>
</div>
